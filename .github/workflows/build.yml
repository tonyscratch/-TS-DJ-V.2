# Builds the TS Dj app (APK) on GitHub's computers every time you upload changes.
# Download it from the "Actions" tab: open the latest run, then "Artifacts" > TSDj-apk.
name: Build TS Dj

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TSDj-apk
          path: app/build/outputs/apk/debug/app-debug.apk
